<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My animal Fact File</title>
     <style>
        body{
            background-color: rgb(189, 160, 0);
            font-family: Arial, Helvetica, sans-serif;
        }

        .factfile {
            background-color: lightyellow;
            color: darkslategray;
            width: 260px;
            padding: 25px;
            border: 4px solid darkblue;
            margin: 
            30px;
        }

        .animal-name {
            color: rgb(13, 126, 190);
            font-size: 22px;
        }

        .detail {
            color: darkslategray;
        }

        .cool-fact {
            color: darkorange;
            font-style: italic;
            font-weight: bold;
        }
     </style>
</head>
<body>
    <div class="factfile">
        <h2 class="animal-name">Snow Leopard</h2>
        <p class="detail">Type: Big cat</p>
        <p class="detail">Lives in: Mountain ranges of Central Asia</p>
        <p class="cool-fact">Cool Fact: Can leap up to 155 metres in one jump</p>
    </div>
</body>
</html>
