<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ice Cream (desserts section)</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: lightcoral;
            text-align: center;
            color: aqua;
        }

        h1 {color: rgb(211, 83, 104);
            font-size: 36px;
        }
        h1 + p {
            color: #8a2be2;
            font-weight: bold;
            background-color: #ebbfd5;
            border-radius: 10px;
        }

        .shop-description::first-letter{
            font-size: 36px;
            color: #ff1493;
            font-weight: bold;
        }

        .menu-box {
            width: 420px;
            background-color: lightsalmon;
            border: 3px solid #ff69b4;
            border-radius: 15px;
            margin: 20px auto;
            padding: 20px;
        }

        ul {
            padding: 0;
        }
        ul > li {
            list-style: none;
            background-color: #fff0f5;
            color: #5c2a4a;
            font-size: 23px;
            font-weight: bolder;
            margin: 10px;
            padding: 15px;
            border-radius: 10px;
            border: 4px solid #eccf70;
        }
        ul > li:nth-child(3) {
            background-color: #ff73d0;
            color: #b85c00;
            border: 5px solid #ffa500;
        }

        ul > li:hover {
      background-color: #ff69b4;
      color: white;
      cursor: pointer;
      transform: scale(1.05);
    }
    button {
      background-color: #d63384;
      color: white;
      border: none;
      border-radius: 20px;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: bold;
    }
    button:hover {
      background-color: #8a2be2;
    }
    </style>
</head>
<body>
   <h1>My Ice Cream Menu</h1>
   <p>Happiness served by the scoop</p>
   <p class="shop-description
   ">
   We scoop up vibrant, velvety, and irresistibly delicious flavours.     
    </p>
    <div class="menu-box">
        <h2>Today's Ice Creeam Flavours</h2>
        <ul>
            <li>Caramel Craze</li>
            <li>Bubblegum Blast </li>
            <li>Mango Madness - Today's Special</li>
            <li>Peach Paradise</li>
            <li>Berry Burst</li>
        </ul>
        <button>Order Now
        </button>
        <button>Looking for More</button>
    </div> 
</body>
</html>
